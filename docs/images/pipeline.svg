<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Data path from the Linux host to the panel">
<style>
  .bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .mut{fill:#898781}
  .grid{stroke:#e1e0d9} .base{stroke:#c3c2b7} .s1{fill:#2a78d6} .s0{fill:#b9b7b0}
  .box{fill:#ffffff;stroke:#c3c2b7} .accent{fill:#e8f1fc;stroke:#2a78d6} .line{stroke:#52514e}
  .aline{stroke:#2a78d6} .tline{stroke:#898781} .ahead{fill:#2a78d6} .thead{fill:#898781}
  text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .base{stroke:#383835} .s1{fill:#3987e5} .s0{fill:#5c5b57}
    .box{fill:#232322;stroke:#4a4a47} .accent{fill:#1d2a3a;stroke:#3987e5} .line{stroke:#c3c2b7}
    .aline{stroke:#3987e5} .ahead{fill:#3987e5}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="thead" d="M0,0 L10,5 L0,10 Z"/></marker></defs>
<rect class="bg" width="900" height="330" rx="8"/>
<rect class="box" x="20" y="70" width="150" height="110" rx="6" stroke-width="1.2"/>
<text class="ink" x="95.0" y="92" font-size="13" font-weight="600" text-anchor="middle">Linux host</text>
<text class="ink2" x="95.0" y="110" font-size="11" text-anchor="middle">gud DRM driver</text>
<text class="ink2" x="95.0" y="125" font-size="11" text-anchor="middle">hid-multitouch</text>
<text class="ink2" x="95.0" y="140" font-size="11" text-anchor="middle">/dev/dri/cardN</text>
<rect class="box" x="220" y="30" width="480" height="270" rx="8" stroke-width="1.2" fill-opacity="0"/>
<text class="ink" x="236" y="52" font-size="13" font-weight="600">ESP32-S3</text>
<rect class="box" x="240" y="70" width="120" height="70" rx="6" stroke-width="1.2"/>
<text class="ink" x="300.0" y="92" font-size="12" font-weight="600" text-anchor="middle">USB task</text>
<text class="ink2" x="300.0" y="110" font-size="11" text-anchor="middle">core 1, TinyUSB</text>
<rect class="box" x="395" y="70" width="120" height="70" rx="6" stroke-width="1.2"/>
<text class="ink" x="455.0" y="92" font-size="12" font-weight="600" text-anchor="middle">2 × RX buffer</text>
<text class="ink2" x="455.0" y="110" font-size="11" text-anchor="middle">PSRAM, 150 KB each</text>
<rect class="accent" x="550" y="70" width="130" height="70" rx="6" stroke-width="1.2"/>
<text class="ink" x="615.0" y="92" font-size="12" font-weight="600" text-anchor="middle">Render task</text>
<text class="ink2" x="615.0" y="110" font-size="11" text-anchor="middle">core 0</text>
<rect class="accent" x="550" y="165" width="130" height="50" rx="6" stroke-width="1.2"/>
<text class="ink" x="615.0" y="195.0" font-size="11" font-weight="600" text-anchor="middle">LZ4 → 64 KB ring</text>
<rect class="accent" x="395" y="165" width="120" height="50" rx="6" stroke-width="1.2"/>
<text class="ink" x="455.0" y="195.0" font-size="11" font-weight="600" text-anchor="middle">byte swap</text>
<rect class="accent" x="395" y="235" width="120" height="50" rx="6" stroke-width="1.2"/>
<text class="ink" x="455.0" y="265.0" font-size="11" font-weight="600" text-anchor="middle">2 × DMA 16 KB</text>
<rect class="box" x="240" y="220" width="120" height="60" rx="6" stroke-width="1.2"/>
<text class="ink" x="300.0" y="242" font-size="12" font-weight="600" text-anchor="middle">Touch task</text>
<text class="ink2" x="300.0" y="260" font-size="11" text-anchor="middle">core 1, every 5 ms</text>
<rect class="box" x="740" y="70" width="140" height="110" rx="6" stroke-width="1.2"/>
<text class="ink" x="810.0" y="92" font-size="13" font-weight="600" text-anchor="middle">ILI9341V</text>
<text class="ink2" x="810.0" y="110" font-size="11" text-anchor="middle">2.8", 320 × 240</text>
<text class="ink2" x="810.0" y="125" font-size="11" text-anchor="middle">RGB565, own GRAM</text>
<rect class="box" x="740" y="220" width="140" height="60" rx="6" stroke-width="1.2"/>
<text class="ink" x="810.0" y="242" font-size="12" font-weight="600" text-anchor="middle">FT6336G</text>
<text class="ink2" x="810.0" y="260" font-size="11" text-anchor="middle">2-point touch</text>
<line class="aline" x1="170" y1="105" x2="238" y2="105" stroke-width="2" marker-end="url(#a)"/>
<text class="ink2" x="204" y="96" font-size="11" text-anchor="middle">USB FS</text>
<text class="ink2" x="204" y="122" font-size="11" text-anchor="middle">LZ4 rects</text>
<line class="aline" x1="360" y1="105" x2="393" y2="105" stroke-width="2" marker-end="url(#a)"/>
<line class="aline" x1="515" y1="105" x2="548" y2="105" stroke-width="2" marker-end="url(#a)"/>
<line class="aline" x1="615" y1="140" x2="615" y2="163" stroke-width="2" marker-end="url(#a)"/>
<line class="aline" x1="550" y1="190" x2="517" y2="190" stroke-width="2" marker-end="url(#a)"/>
<line class="aline" x1="455" y1="215" x2="455" y2="233" stroke-width="2" marker-end="url(#a)"/>
<path class="aline" d="M515,260 H720 V150 H738" fill="none" stroke-width="2" marker-end="url(#a)"/>
<text class="ink2" x="728" y="205" font-size="11" text-anchor="end">SPI</text>
<text class="ink2" x="728" y="219" font-size="11" text-anchor="end">40 MHz</text>
<path class="tline" d="M738,265 H705 V292 H300 V282" fill="none" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#t)"/>
<text class="mut" x="560" y="284" font-size="11" text-anchor="middle">I2C</text>
<path class="tline" d="M240,250 H200 V160 H172" fill="none" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#t)"/>
<text class="mut" x="196" y="210" font-size="11" text-anchor="end">HID</text>
</svg>
